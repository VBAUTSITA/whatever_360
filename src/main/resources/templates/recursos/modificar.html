<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<head th:replace="layouts/base::head">
</head>
<link href="../static/css/jquery.dataTables.min.css" rel="stylesheet"
		th:href="@{/css/jquery.dataTables.min.css}">
<style>
	.box-modificar { overflow-x: auto; }

	#tabla_modificar input[type="text"] {
		width: 100%;
		min-width: 90px;
		border: 1px solid #ddd;
		border-radius: 4px;
		padding: 4px 6px;
		font-size: 13px;
		outline: none;
		transition: border-color .15s, background .15s;
		margin-bottom: 0;
	}
	#tabla_modificar input:focus { border-color: #999; background: #fff; }

	.acciones-modificar { margin: 15px 0 30px 0; }

	.btn_eliminar {
		color: #c0392b;
		font-weight: 600;
		text-decoration: none;
		white-space: nowrap;
	}
	.btn_eliminar:hover { text-decoration: underline; }

	.sin-registros {
		padding: 20px;
		text-align: center;
		color: #888;
		font-style: italic;
	}
</style>
<body>
<header th:replace="layouts/base_reportes::header"></header>

<div class="main">
	<div class="container">

		<div class="title-main">
			<h2>Modificar mis Recursos</h2>
		</div>

		<a class="btn btn-primary" href="#"
			th:href="@{/recursos/list}" role="button">
			Regresar</a>
	</div>

<div class="box-lista-interferencia">

	<p style="font-size:12px;color:#666;margin:0 0 10px 0;">
		&#9432; Solo se muestran y pueden editarse o eliminarse los registros que t&uacute; ingresaste.
	</p>

	<div th:if="${#lists.isEmpty(recursosForm.recursos)}" class="sin-registros">
		No tienes registros para modificar.
	</div>

	<form th:unless="${#lists.isEmpty(recursosForm.recursos)}"
	      th:action="@{/recursos/modificar}" th:object="${recursosForm}" method="post">
	<div class="box-modificar">
		<table id="tabla_modificar" class="table table-striped table-bordered list_results" style="width:100%">
			<thead>
				<tr>
					<th>SEMANA</th>
					<th>SITE NAME</th>
					<th>CELL NAME</th>
					<th>LONGITUD</th>
					<th>LATITUD</th>
					<th>TECNOLOGIA</th>
					<th>PROYECTO</th>
					<th>JEFATURA</th>
					<th>MOD</th>
					<th>CARRIER</th>
					<th>AZIMUTH</th>
					<th>TXRXMODE</th>
					<th>FREQBAND</th>
					<th>INDOOR</th>
					<th>ELIMINAR</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="r, iterStat : *{recursos}">

					<td>
						<input type="hidden" th:field="*{recursos[__${iterStat.index}__].id}"/>
						<input type="text" th:field="*{recursos[__${iterStat.index}__].semana}"/>
					</td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].siteName}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].cellName}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].longitud}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].latitud}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].tecnologia}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].proyecto}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].jefatura}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].mod}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].carrier}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].azimuth}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].txrxmode}"/></td>
					<td><input type="text" th:field="*{recursos[__${iterStat.index}__].freqband}"/></td>
					<td style="text-align:center;">
						<input type="checkbox" th:field="*{recursos[__${iterStat.index}__].indoor}" value="S"/>
					</td>

					<!--
					<td>
						<a class="btn_eliminar"
						   th:href="@{/recursos/eliminar/{id}(id=${r.id})}"
						   onclick="return confirmarEliminacion(this)">
							Eliminar
						</a>
					</td>-->
					
					<td>
					    <a th:href="@{/recursos/eliminar/{id}(id=${r.id})}"
					       class="btn btn-danger"
					       onclick="return confirm('¿Eliminar este registro?')">
					        Eliminar
					    </a>
					</td>

				</tr>
			</tbody>
		</table>
	</div>

	<div class="acciones-modificar">
		<button type="submit" class="btn btn-primary">&#128190; Guardar cambios</button>
		<a th:href="@{/recursos/list}" class="btn">Cancelar</a>
	</div>
	</form>

</div>

</div>

<div  th:replace="layouts/base::footer"></div>

<script>
function confirmarEliminacion(enlace) {
	var confirmacion = confirm("\u00bfEst\u00e1s seguro de eliminar este registro?");
	return confirmacion;
}
</script>

</body>
</html>
