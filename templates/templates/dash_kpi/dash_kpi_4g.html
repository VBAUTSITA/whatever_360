}
.kpi-panel {

/* ESTILOS DE FORMULARIO */

.select2-kpi .select2-selection__rendered {
  line-height: 1.4em !important;
  font-size: 13px !important;

  padding-left: 8px !important;
    position: absolute;
    overflow: hidden !important;

/* --- ESTILOS SELECT2 PARA FILTROS DINÁMICOS --- */
.select2-dinamicos {

.select2-dinamicos .select2-selection__rendered {

}
.select2-dinamicos .select2-selection__choice {
  background-color: #e4e7ef;
  color: #313366;
  border: 1px solid #c1c4cf;
  font-size: 13px;
  margin-top: 2px;
  max-width: 110px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* TITULOS FILTROS DINÁMICOS */
#filtros-dinamicos label {
	font-weight: 600;
    font-size: 15px;
    margin-bottom: -20px;
    display: block;
    color: #444;
}
#filtros-dinamicos > div {
  margin-bottom: 14px;
}

/* PREVENIR SCROLL X INDESEADO POR DROPDOWN */
body {
  overflow-x: hidden;
}
.select2-dropdown {
  max-width: 100vw !important;
  box-sizing: border-box;
  overflow-x: auto;
}
.btn-select-all,
.btn-deselect-all {
    background: #eee;
    border: 1px solid #bbb;
    border-radius: 4px;
    font-size: 11px;
    padding: 2px 6px;
    cursor: pointer;
    transition: background 0.2s;
}

.btn-select-all:hover,
.btn-deselect-all:hover {

}
.sugerencias-autocompletado {
    position: absolute;
    background: white;
    border: 1px solid #ccc;
    max-height: 150px;
    overflow-y: auto;
    z-index: 1000;
    width: 100%;
    display: none;
    max-width: 292px;
}

.sugerencias-autocompletado div {
    padding: 6px 10px;
    cursor: pointer;
}

.sugerencias-autocompletado div:hover {
    background-color: #f0f0f0;
}

/* RESPONSIVE */
@media (max-width: 1200px) {
  .kpi-container {
    flex-direction: column;
  }
  .kpi-formulario,
  .kpi-filtros {
    max-width: 100%;
  }
}

</style>

<script>
let dataOriginal = [];
let chart = null;
let ultimoPayload = null;

function generarSelectMultiple(arr, id, labelName) {
    let contenedor = document.createElement('div');
    contenedor.classList.add('filtro-item');

    let label = document.createElement('label');
    label.textContent = labelName;

    let botones = document.createElement('div');
    botones.style.display = 'flex';
    botones.style.justifyContent = 'flex-end';
    botones.style.gap = '4px';
    botones.style.marginBottom = '5px';

    let btnSelectAll = document.createElement('button');
    btnSelectAll.textContent = 'Seleccionar todo';
    btnSelectAll.type = 'button';
    btnSelectAll.classList.add('btn-select-all');
    btnSelectAll.onclick = () => {
        $(`#${id} option`).prop('selected', true);
        $(`#${id}`).trigger('change');
    };

    let btnDeselectAll = document.createElement('button');
    btnDeselectAll.textContent = 'Eliminar selección';
    btnDeselectAll.type = 'button';
    btnDeselectAll.classList.add('btn-deselect-all');
    btnDeselectAll.onclick = () => {
        $(`#${id} option`).prop('selected', false);
        $(`#${id}`).trigger('change');
    };

    botones.appendChild(btnSelectAll);
    botones.appendChild(btnDeselectAll);

    let select = document.createElement('select');
    select.id = id;
    select.multiple = true;
    select.style.width = '100%';

    arr.forEach(valor => {
        if (valor === "") return;
        let opt = document.createElement("option");
        opt.value = valor;
        opt.textContent = valor;
        opt.selected = true;
        select.appendChild(opt);
    });

    contenedor.appendChild(label);
    contenedor.appendChild(botones);
    contenedor.appendChild(select);

    document.getElementById('filtros-dinamicos').appendChild(contenedor);

    $(`#${id}`).select2({
        placeholder: labelName,
        width: 'resolve'
    });

    $(`#${id}`).on('change', filtrarYGraficar);
}


document.getElementById('filterForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const formData = new FormData(this);
    const payload = {
        startDate: formData.get('startDate'),
        endDate: formData.get('endDate'),
        codigos: formData.get('codigos').split(',').map(c => c.trim()).filter(c => c),
        kpi: formData.get('kpi'),
        aggregation: formData.get('aggregation')
    };
    ultimoPayload = payload;
    this.querySelector('button[type=submit]').disabled = true;
    this.querySelector('button[type=submit]').textContent = "Cargando...";
    const response = await fetch('/api/kpi-data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    this.querySelector('button[type=submit]').disabled = false;
    this.querySelector('button[type=submit]').textContent = "Actualizar";
    if (!response.ok) { alert('Error al obtener datos'); return; }
    const data = await response.json();
    procesarDatos(data);
});

function procesarDatos(data) {
    dataOriginal = data;
    document.getElementById('filtros-dinamicos').innerHTML = '';
    const regiones = [...new Set(data.map(d => d.region))];
    const subregiones = [...new Set(data.map(d => d.subRegion))];
    const departamentos = [...new Set(data.map(d => d.departamento))];
    const provincias = [...new Set(data.map(d => d.provincia))];
    const clusters = [...new Set(data.map(d => d.clusterName))];
    const distritos = [...new Set(data.map(d => d.distrito))];
    const codigos = [...new Set(data.map(d => d.codigoSitio))];
    const enodobs = [...new Set(data.map(d => d.enodobName))];
    const sectores = [...new Set(data.map(d => d.sectorName))];
    const cellnames = [...new Set(data.map(d => d.cellname))];
    const carriers = [...new Set(data.map(d => d.carrier))];

    generarSelectMultiple(regiones, 'select-region', 'Región');
    generarSelectMultiple(subregiones, 'select-subregion', 'Subregión');
    generarSelectMultiple(departamentos, 'select-departamento', 'Departamento');
    generarSelectMultiple(provincias, 'select-provincia', 'Provincia');
    generarSelectMultiple(clusters, 'select-cluster', 'Cluster');
    generarSelectMultiple(distritos, 'select-distrito', 'Distrito');
    generarSelectMultiple(codigos, 'select-codigo', 'Código Sitio');
    generarSelectMultiple(enodobs, 'select-enodob', 'eNodeB');
    generarSelectMultiple(sectores, 'select-sector', 'Sector');
    generarSelectMultiple(cellnames, 'select-cellname', 'Cellname');
    generarSelectMultiple(carriers, 'select-carrier', 'Carrier');
    filtrarYGraficar();
}

function filtrarYGraficar() {
    const regionesSel = $('#select-region').val() || [];
    const subregionesSel = $('#select-subregion').val() || [];
    const departamentosSel = $('#select-departamento').val() || [];
    const provinciasSel = $('#select-provincia').val() || [];
    const clustersSel = $('#select-cluster').val() || [];
    const distritosSel = $('#select-distrito').val() || [];
    const codigosSel = $('#select-codigo').val() || [];
    const enodobsSel = $('#select-enodob').val() || [];
    const sectoresSel = $('#select-sector').val() || [];
    const cellnamesSel = $('#select-cellname').val() || [];
    const carriersSel = $('#select-carrier').val() || [];

    const filtrada = dataOriginal.filter(d =>
        regionesSel.includes(d.region) &&
        subregionesSel.includes(d.subRegion) &&
        departamentosSel.includes(d.departamento) &&
        provinciasSel.includes(d.provincia) &&
        clustersSel.includes(d.clusterName) &&
        distritosSel.includes(d.distrito) &&
        codigosSel.includes(d.codigoSitio) &&
        enodobsSel.includes(d.enodobName) &&
        sectoresSel.includes(d.sectorName) &&
        cellnamesSel.includes(d.cellname) &&
        carriersSel.includes(d.carrier)
    );

    graficar(filtrada);
}

function graficar(data) {
	
	// Ocultar placeholder si hay datos
    const placeholder = document.getElementById('grafico-placeholder');
    if (data.length > 0) {
        placeholder.style.display = 'none';
    } else {
        placeholder.style.display = 'block';
    }
    //////
    
    const agrupacion = document.getElementById('select-agrupacion').value;
    const agregacion = document.getElementById('select-agregacion').value;

    const isRatio = data.length > 0 && data[0].numValue !== undefined && data[0].denValue !== undefined;

    function getGroupKey(d) {
        switch (agrupacion) {
            case 'region': return d.region;
            case 'subRegion': return d.subRegion;
            case 'departamento': return d.departamento;
            case 'provincia': return d.provincia;
            case 'clusterName': return d.clusterName;
            case 'distrito': return d.distrito;
            case 'codigoSitio': return d.codigoSitio;
            case 'enodobName': return d.enodobName;
            case 'sectorName': return d.sectorName;
            case 'cellname': return d.cellname;
            case 'carrier': return d.carrier;
            case 'codigoSitio_carrier': return `${d.codigoSitio} | ${d.carrier}`;
            case 'codigoSitio_cellname_carrier': default:
                return `${d.codigoSitio} | ${d.cellname} | ${d.carrier}`;
        }
    }

    const grupos = {};
    data.forEach(d => {
        const group = getGroupKey(d);
        const fecha = d.resultTime;
        if (!grupos[group]) grupos[group] = {};
        if (!grupos[group][fecha]) grupos[group][fecha] = [];
        grupos[group][fecha].push(d);
    });

    const datasets = Object.entries(grupos).map(([key, fechas]) => ({
        label: key,
        data: Object.entries(fechas).map(([fecha, valores]) => {
            let y;
            if (isRatio) {
                let totalNum = 0, totalDen = 0;
                for (const v of valores) {
                    totalNum += Number(v.numValue ?? 0);
                    totalDen += Number(v.denValue ?? 0);
                }
                y = totalDen === 0 ? null : Number((totalNum / totalDen).toFixed(2));
            } else {
                const kpis = valores.map(v => v.kpiValue);
                y = agregacion === "sum"
                    ? Number((kpis.reduce((a, b) => a + b, 0)).toFixed(2))
                    : Number((kpis.reduce((a, b) => a + b, 0) / kpis.length).toFixed(2));
            }
            return { x: fecha, y };
        }),
        borderWidth: 2,
        spanGaps: true,
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: 0.3
    }));

    const labels = [...new Set(data.map(d => d.resultTime))].sort();

    if (chart) chart.destroy();

    const kpi = ultimoPayload?.kpi || 'kpi';
    const labelKpi = kpiLabels[kpi.replace(/_num$/, '')] || kpi;

    chart = new Chart(document.getElementById('kpiChart').getContext('2d'), {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true,
                    position: 'bottom',
                    labels: {
                        boxWidth: 16,
                        font: { size: 11 },
                        filter: function(item) {
                			return typeof item.index == 'number' && item.index < 30
                		}
                    }
                },
                tooltip: {
                    enabled: true,
                    callbacks: {
                        label: context => `${context.dataset.label}: ${context.parsed.y?.toFixed(2)}`
                    }
                },
                title: {
                    display: true,
                    text: `Indicador: ${labelKpi}`,
                    font: { size: 18, weight: 'bold' },
                    color: '#333',
                    padding: { top: 10, bottom: 10 }
                }
            },
            layout: {
                padding: { top: 8, right: 10, bottom: 30, left: 5 }
            },
            interaction: { mode: 'nearest', intersect: false },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Fecha',
                        font: { size: 14, weight: '600' },
                        color: '#555'
                    },
                    ticks: {
                        autoSkip: true,
                        maxTicksLimit: 18,
                        maxRotation: 32,
                        minRotation: 8,
                        font: { size: 11 }
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: labelKpi,
                        font: { size: 14, weight: '600' },
                        color: '#555'
                    },
                    ticks: {
                        font: { size: 11 },
                        callback: value => Number(value).toFixed(2)
                    }
                }
            }
        }
    });
    
 // Leyenda personalizada en 4 filas (hasta 30 elementos)
    const leyendaHTML = datasets
      .slice(0, 30) // Limita a 30 leyendas
      .map(ds => `
        <div style="display: flex; align-items: center; gap: 6px; max-width: 200px;">
          <span style="
            display:inline-block;
            width:12px;
            height:12px;
            background:${ds.borderColor || '#333'};
            border-radius:50%;
            flex-shrink: 0;
          "></span>
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            ${ds.label}
          </span>
        </div>
      `)
      .join('');
    document.getElementById('leyenda-custom').innerHTML = leyendaHTML;


    
}

document.getElementById('select-agrupacion').addEventListener('change', filtrarYGraficar);
document.getElementById('select-agregacion').addEventListener('change', filtrarYGraficar);

</script>


<script type="text/javascript">
document.getElementById('input-zona').addEventListener('input', async function () {
    const termino = this.value.trim();
    const tipo = document.getElementById('tipo-zona').value;

    if (termino.length < 2) {
        document.getElementById('zona-sugerencias').style.display = 'none';
        return;
    }

    const res = await fetch(`/api/buscar-zona?tipo=${tipo}&termino=${encodeURIComponent(termino)}`);
    const sugerencias = await res.json();

    const contenedor = document.getElementById('zona-sugerencias');
    contenedor.innerHTML = '';
    sugerencias.forEach(item => {
        const div = document.createElement('div');
        div.textContent = item;
        div.onclick = () => {
            document.getElementById('input-zona').value = item;
            contenedor.style.display = 'none';
            buscarCodigosDesdeZona(tipo, item);
        };
        contenedor.appendChild(div);
    });
    contenedor.style.display = 'block';
});

async function buscarCodigosDesdeZona(tipo, valor) {
    const res = await fetch(`/api/obtener-codigos?tipo=${tipo}&valor=${encodeURIComponent(valor)}`);
    const codigos = await res.json();
    document.querySelector('input[name="codigos"]').value = codigos.join(',');
}
</script>

// --- Función para obtener etiqueta amigable ---
function getKpiLabel(kpiName) {
  const base = kpiName.replace(/_num$/, "").replace(/_den$/, "");
  return kpiLabels[base] || kpiName.toUpperCase();
}

// --- Cargar select de KPIs al iniciar ---
function initKpiSelect() {
  const kpiSelect = document.getElementById('kpi');
  kpiSelect.innerHTML = '';
  allKpis.forEach(kpi => {
    const isCompuesto = kpisCompuestos.includes(kpi);
    const option = document.createElement('option');
    option.value = isCompuesto ? `${kpi}_num` : kpi;
    option.textContent = getKpiLabel(kpi);
    kpiSelect.appendChild(option);
  });

  // Activar select2
  $('#kpi').select2({
    placeholder: 'Selecciona un KPI',
    allowClear: true,
    width: 'resolve'
  });
}

document.addEventListener('DOMContentLoaded', initKpiSelect);
