$.ajax({

	url: baseSiteUrl + '/baseline-graph-5g-nsa/data/graph03',
	method: 'GET',
	success: function(data) {
	var estadoData = [];
	var cantidadData = [];
	data.forEach(function(item) {
	estadoData.push(item.estado);
	cantidadData.push(item.cantidad);
	});

	        series: cantidadData,
	          chart: {
	          width: 350,
	          type: 'pie',
	        },
	        labels: estadoData,
	        responsive: [{
	          breakpoint: 480,
	          options: {
	            chart: {
	              width: 200
	            },
	            legend: {
	              position: 'bottom'
	            }
	          }
	        }],
	        title: {
		          text: "PARAMETROS EN EL BASELINE",
		          align: 'center'
		      },

		    fill: {
			       opacity: 1,
			       colors: ['#b2a4c4', '#c3393d', '#000' , '#da272c']
			      },
			//informacion dentro
			tooltip: {
			          y: {
			            formatter: function (val) {
			              return "" + val + " %"
			            }
			          }
			      },
	        };

	      var chart3 = new ApexCharts(document.querySelector("#chart3"), options);
	      chart3.render();
