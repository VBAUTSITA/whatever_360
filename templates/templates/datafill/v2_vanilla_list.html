<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<head th:replace="layouts/base::head"></head>
<link href="../static/css/jquery.dataTables.min.css" rel="stylesheet"
      th:href="@{/css/jquery.dataTables.min.css}">

<body>
<header th:replace="layouts/base::header"></header>

<div class="main">
    <div class="container">
        <div class="title-main">
            <h2>DataFill 4G — Lista de Sitios</h2>
        </div>

        <!-- Search bar -->
        <form method="get" th:action="@{/datafill/list}" class="mb-3 d-flex gap-2">
            <input type="text" name="search" class="form-control w-25"
                   placeholder="Buscar por sitio o código..."
                   th:value="${search}"/>
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:href="@{/datafill/list}" class="btn btn-secondary">Limpiar</a>
        </form>
    </div>

    <div class="box-lista-interferencia">
        <table id="lista_datafields" class="table table-striped table-bordered list_results" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>SITE CODE</th>
                    <th>SITE NAME</th>
                    <th>ENODEB NAME</th>
                    <th>ENODEB ID</th>
                    <th>TAC</th>
                    <th>EPC PRIMARIO</th>
                    <th>GENERADO</th>
                    <th>BOOK RRU</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="field : ${fields}">
                    <td th:text="${field.idDataField}"></td>
                    <td th:text="${field.siteCode}"></td>
                    <td th:text="${field.siteName}"></td>
                    <td th:text="${field.site4g}"></td>
                    <td th:text="${field.enodebId}"></td>
                    <td th:text="${field.tac}"></td>
                    <td th:text="${field.mmePrimario}"></td>
                    <td>
                        <span th:if="${field.generado == 1}"
                              class="badge bg-success">Generado</span>
                        <span th:if="${field.generado != 1}"
                              class="badge bg-secondary">Pendiente</span>
                    </td>
                    <td>
                        <a class="btn btn-success btn-sm"
                           th:href="@{'/datafill/' + ${field.idDataField} + '/bookrru'}"
                           role="button">Book RRU</a>
                    </td>
                </tr>
            </tbody>
            <tfoot style="display:none;">
                <tr>
                    <th>ID</th>
                    <th>SITE CODE</th>
                    <th>SITE NAME</th>
                    <th>ENODEB NAME</th>
                    <th>ENODEB ID</th>
                    <th>TAC</th>
                    <th>EPC PRIMARIO</th>
                    <th>GENERADO</th>
                    <th>BOOK RRU</th>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<div th:replace="layouts/base::footer"></div>
<script type="text/javascript" th:src="@{/js/jquery.dataTables.min.js}"></script>
<script type="text/javascript" th:src="@{/js/dataTables.buttons.min.js}"></script>
<script type="text/javascript" th:src="@{/js/buttons.html5.min.js}"></script>
<script type="text/javascript" th:src="@{/js/buttons.flash.min.js}"></script>
<script type="text/javascript" th:src="@{/js/buttons.print.min.js}"></script>

<script>
$(document).ready(function () {
    $('#lista_datafields tfoot th').each(function () {
        var title = $(this).text();
        $(this).html('<input type="text" placeholder="Buscar ' + title + '" />');
    });

    var table = $('#lista_datafields').DataTable({
        aaSorting: [],
        dom: 'Bfrtip',
        buttons: ['copy', 'csv'],
        scrollY: '400px',
        scrollX: true,
        scrollCollapse: true,
        fixedColumns: true
    });

    table.columns().every(function () {
        var that = this;
        $('input', this.footer()).on('keyup change clear', function () {
            if (that.search() !== this.value) {
                that.search(this.value).draw();
            }
        });
    });
});
</script>
</body>
</html>
