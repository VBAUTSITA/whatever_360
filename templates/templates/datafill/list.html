<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<head th:replace="layouts/base::head">
    <title>DataFill 4G — Lista</title>
</head>

<body>
<header th:replace="layouts/base::header"></header>

<div class="main">
<div class="container pb-5">

    <div class="title-main mt-3 d-flex justify-content-between align-items-center">
        <h2>DataFill 4G — Sitios</h2>
    </div>

    <!-- Search bar -->
    <form th:action="@{/datafill/list}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" name="search" class="form-control"
                   placeholder="Buscar por nombre o código de sitio..."
                   th:value="${search}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-search"></i> Buscar
            </button>
            <a th:href="@{/datafill/list}" class="btn btn-outline-secondary">
                <i class="bi bi-x"></i> Limpiar
            </a>

			<button id="btn-sync-list"
			        class="btn btn-sm btn-outline-danger">
			    <i class="bi bi-arrow-repeat"></i> Actualizar la lista
			</button>

        </div>
    </form>

    <!-- Results table -->
    <div class="card">
        <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
            <strong>Sitios disponibles</strong>
            <span class="badge bg-light text-dark"
                  th:text="${#lists.size(fields)} + ' sitio(s)'"></span>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>eNodeB</th>
                        <th>MBTS</th>
                        <th>TAC</th>
                        <th>Generado</th>
                        <th style="width:140px">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${fields}">
                        <td th:text="${f.idDataField}"></td>
                        <td th:text="${f.siteCode}"></td>
                        <td th:text="${f.siteName}"></td>
                        <td class="small" th:text="${f.site4g}"></td>
                        <td class="small" th:text="${f.mbts}"></td>
                        <td th:text="${f.tac}"></td>
                        <td>
                            <span th:if="${f.generado == 1}"
                                  class="badge bg-success">Sí</span>
                            <span th:if="${f.generado != 1}"
                                  class="badge bg-secondary">No</span>
                        </td>
                        <td class="text-nowrap">
                            <a th:href="@{'/datafill/' + ${f.idDataField} + '/bookrru'}"
                               class="btn btn-sm btn-outline-danger me-1">
                                <i class="bi bi-tools"></i> Book RRU
                            </a>
                            <button type="button"
                                    class="btn btn-sm btn-outline-secondary btn-sync"
                                    th:data-id="${f.idDataField}"
                                    title="Sincronizar datos desde SMART">
                                <i class="bi bi-arrow-repeat"></i> Sync
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(fields)}">
                        <td colspan="8" class="text-center text-muted fst-italic py-3">
                            No se encontraron sitios
                            <span th:if="${search != null and !#strings.isEmpty(search)}">
                                para "<strong th:text="${search}"></strong>"
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</div>

<footer th:replace="layouts/base::footer"></footer>

<script>

	document.getElementById('btn-sync-list')?.addEventListener('click', function () {
	    if (!confirm('Sync NEW DataFields (2026+) from SMART?')) return;

	    const btn = this;
	    btn.disabled = true;
	    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Syncing...';

	    fetch('/datafill/sync-list', {
	        method: 'POST'
	    })
	    .then(() => {
	        // Controller redirects to /datafill/list
	        window.location.href = '/web-tracker/datafill/list';
	    })
	    .catch(err => {
	        alert('Error syncing list: ' + err);
	        btn.disabled = false;
	        btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Sync the list';
	    });
	});
	

document.querySelectorAll('.btn-sync').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var id = this.getAttribute('data-id');
        if (!confirm('Sincronizar DataField ' + id + ' desde SMART?\n\nEsto sobreescribirá los datos en DESARROLLO.')) return;

        var self = this;
        self.disabled = true;
	var baseSiteUrl = window.location.origin;

        self.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

        fetch('/web-tracker/datafill/' + id + '/sync', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.resultado && data.resultado.startsWith('OK')) {
                    self.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i> OK';
                    self.classList.replace('btn-outline-secondary', 'btn-outline-success');
                } else {
                    alert('Error al sincronizar:\n' + (data.resultado || 'Sin detalle'));
                    self.disabled = false;
                    self.innerHTML = '<i class="bi bi-arrow-repeat"></i> Sync';
                }
            })
            .catch(function(err) {
                alert('Error de red: ' + err);
                self.disabled = false;
                self.innerHTML = '<i class="bi bi-arrow-repeat"></i> Sync';
            });
    });
});
</script>
</body>
</html>
