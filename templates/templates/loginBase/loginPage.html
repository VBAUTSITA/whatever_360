<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
      
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">      
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.8/css/solid.css">
<script src="https://use.fontawesome.com/releases/v5.0.7/js/all.js"></script>
<head th:replace="layouts/base::head">
</head>

   <body class="login-page">
      <!-- Include _menu.html -->
       <!-- <th:block th:include="loginBase/_menu"></th:block> -->     
        
      <div class="box-login">   
        <div class="login-access"> 
            <div class="form-login"> 
            	
            	<div class="login-img">
                    <figure>
                    	<img src="../static/images/antena.png" th:src="@{/images/claro-logo.png}"/>
                    	<h4>RAN 360</h4>
                    </figure>
                </div>
                <h2 class="title-login">Ingresar a la plataforma</h2>
      
			      <form name='f' th:action="@{/j_spring_security_check}" method='POST'>
			         	<p id="user-group">
			               <input type='text' name='username' value='' placeholder="Código">
			            </p>
			            <p id="contrasena-group">
			               <input type='password' name='password' placeholder="Contraseña"/>
			            </p>
			            
			            <!-- <div style="display:flex;"><p>Recordar Me?</p>
			            <input type="checkbox" name="remember-me" /></div> -->
			            
			            <div class="button-login">
			            <input name="submit" type="submit" value="Ingresar" />
			            </div>
			            
			         	 <!-- /login?error=true -->
					      <div th:if="${#request.getParameter('error') == 'true'}"
					            style="color:#fff;margin:10px 0px;">
					         Usuario o contraseña inválidos.
					         <!-- <span th:if="${#session!= null and #session.getAttribute('SPRING_SECURITY_LAST_EXCEPTION') != null}"
					            th:utext="${#session.getAttribute('SPRING_SECURITY_LAST_EXCEPTION').message}">
					                Static summary
					         </span>-->
					            
					      </div>
			      </form>
			      
			      <div class="btn_datos"> 
			      	<a class="btn_register left" href="#" th:href="@{/seguimiento/addaccount}" >Crear Cuenta</a>
			      	<a class="btn_register right" href="#" th:href="@{/seguimiento/recuperarcuenta}" >¿Olvidaste tu contraseña?</a>
			      </div>
        	</div>   
       	</div> 
      </div> 
     
      

      
      <!-- <br>
      Username/pass:
      <ul>
        <li>dbuser1/123</li>
        <li>dbadmin1/123</li>
      </ul>  -->
       
<div th:replace="layouts/base::footer"></div>   
   
   </body>
    
</html>
