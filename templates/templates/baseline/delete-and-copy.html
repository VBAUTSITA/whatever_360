<body>

<header th:replace="layouts/base_baseline::header"></header>


<div class="main maestro_baseline">
	<div class="container">
		<a class="btn btn-primary" href="#" 
			th:href="@{'/baseline-admin'}" role="button">
			Regresar</a>
		<div class="title-main">
			<h2 style="text-transform: initial;font-size: 27px;font-family: 'Verdana';margin-top: 25px;">
			BASELINE 4G FDD SRAN
			</h2>
		</div>
		
		<button id="executeSqlButton" onclick="return confirmarCargaSql(this)">Cargar Baseline al portal de Usuarios</button>
		
		
			
	</div>
</div>

<div  th:replace="layouts/base::footer"></div>
<script type="text/javascript" th:src="@{/js/jquery.dataTables.min.js}"></script>

<script type="text/javascript" th:src="@{/js/buttons.html5.min.js}"></script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script type="text/javascript">
$(document).ready(function() {
	  $('#executeSqlButton').click(function(event) {
	    const confirmation = confirm('¿Estás seguro de ejecutar la carga de datos del baseline? Esta acción podría modificar la base de datos.');

	    if (confirmation) {
	      $.get('/baseline-admin/carga-baseline-usuarios/execute-sql', function(response) {
	        alert(response);
	      });
	    } else {
	      // User canceled the action
	      event.preventDefault(); // Prevent default button action (optional)
	    }
	  });
	});
</script>
</body>
