<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Parametros List</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
<h1>Parametros No Homologados</h1>
<ul>
<li th:each="parametrosCount : ${parametrosCounts}">
<a th:href="@{|/baseline/parametros/${parametrosCount[0]}|}" th:text="${parametrosCount[0]} + ' (' + ${parametrosCount[1]} + ')'"></a>
</li>
</ul>
</body>
</html>
